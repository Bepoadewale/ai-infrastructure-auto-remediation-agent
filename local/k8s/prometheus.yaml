apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: sre-remediation
data:
  prometheus.yml: |
    global:
      scrape_interval: 2s
      evaluation_interval: 2s
    scrape_configs:
      - job_name: checkout-api
        kubernetes_sd_configs: [{role: pod}]
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            action: keep
            regex: sre-remediation
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: checkout-api
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            action: keep
            regex: http
    rule_files: [/etc/prometheus/alerts.yml]
  alerts.yml: |
    groups:
      - name: sre-remediation
        rules:
          - alert: CheckoutUnavailable
            expr: checkout_fixture_healthy == 0
            for: 0s
            labels: {severity: page}
            annotations: {summary: Checkout readiness regression}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: sre-remediation, labels: {app: prometheus}}
spec:
  replicas: 1
  selector: {matchLabels: {app: prometheus}}
  template:
    metadata: {labels: {app: prometheus}}
    spec:
      serviceAccountName: prometheus
      containers:
        - name: prometheus
          image: prom/prometheus:v3.6.0
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
          ports: [{containerPort: 9090, name: web}]
          volumeMounts: [{name: config, mountPath: /etc/prometheus}]
          resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
      volumes: [{name: config, configMap: {name: prometheus-config}}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: prometheus, namespace: sre-remediation}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: sre-remediation-prometheus}
rules:
  - apiGroups: [""]
    resources: [pods, nodes, services, endpoints]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: sre-remediation-prometheus}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: sre-remediation-prometheus}
subjects: [{kind: ServiceAccount, name: prometheus, namespace: sre-remediation}]
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: sre-remediation}
spec: {selector: {app: prometheus}, ports: [{port: 9090, targetPort: web}]}
