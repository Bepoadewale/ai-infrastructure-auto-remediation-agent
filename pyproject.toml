[project]
name = "ai-infrastructure-auto-remediation-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn>=0.30,<1", "prometheus-client>=0.21,<1", "kubernetes>=31,<34"]
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[tool.setuptools]
package-dir = {"" = "control-plane/src"}
[tool.setuptools.packages.find]
where = ["control-plane/src"]
[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx>=0.27,<1", "ruff>=0.8,<1"]
[tool.pytest.ini_options]
pythonpath = ["control-plane/src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
ignore = ["B008"]
